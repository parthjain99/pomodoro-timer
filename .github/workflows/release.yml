name: Release

# Publishes installers automatically when a version tag is pushed, e.g. v0.1.1:
#   git tag v0.1.1 && git push origin v0.1.1
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            command: npx electron-builder --mac dmg --arm64 --publish never
            files: release/*.dmg
          - os: windows-latest
            command: npx electron-builder --win nsis --x64 --publish never
            files: release/*.exe
          - os: ubuntu-latest
            command: npx electron-builder --linux AppImage --x64 --publish never
            files: release/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.files }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
