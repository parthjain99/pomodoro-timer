<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../assets/style.css" />
  <script src="../assets/gsap.min.js"></script>
</head>
<body>
  <div data-composition-id="s2" data-width="1920" data-height="1080" class="clip">
    <div class="card" style="left:560px;top:150px;width:800px;height:760px;padding:60px;box-sizing:border-box;text-align:center;">
      <div class="tabs" style="margin-top:70px;">
        <div class="tab" id="t1">Focus</div>
        <div class="tab" id="t2">Short Break</div>
        <div class="tab" id="t3">Long Break</div>
      </div>
      <div class="mono" id="s2clock" style="font-size:230px;font-weight:700;margin-top:60px;line-height:1;">25:00</div>
    </div>
    <div class="cap" id="s2cap" style="top:60px;">Focus. Short Break. Long Break.</div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const fmt = (s) => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(Math.floor(s % 60)).padStart(2, "0");
    tl.to("#t1", { opacity: 1, duration: 0.2 }, 0.52);
    tl.to("#t2", { opacity: 1, duration: 0.2 }, 1.02);
    tl.to("#t3", { opacity: 1, duration: 0.2 }, 1.52);
    tl.to("#t1", { backgroundColor: "#ff6b81", borderColor: "#ff6b81", duration: 0.01 }, 0.52);
    const clk = { s: 1500 };
    tl.to(clk, { s: 1497, duration: 2.5, ease: "none", onUpdate: () => { document.getElementById("s2clock").textContent = fmt(clk.s); } }, 1.0);
    tl.to("#s2cap", { opacity: 1, duration: 0.3 }, 0);
    window.__timelines = window.__timelines || {};
    window.__timelines["s2"] = tl;
  </script>
</body>
</html>
