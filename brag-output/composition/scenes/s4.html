<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../assets/style.css" />
  <script src="../assets/gsap.min.js"></script>
</head>
<body>
  <div data-composition-id="s4" data-width="1920" data-height="1080" class="clip">
    <div class="cap" id="s4cap" style="top:60px;">Press play in the video. The timer starts.</div>
    <div class="card" id="s4timer" style="left:200px;top:240px;width:640px;height:640px;padding:50px;box-sizing:border-box;text-align:center;opacity:0;">
      <div class="mono" id="s4clock" style="font-size:150px;font-weight:700;margin-top:50px;">25:00</div>
      <div class="btn" id="s4btn" style="margin-left:auto;margin-right:auto;">Start</div>
    </div>
    <div class="card" id="s4video" style="left:920px;top:240px;width:800px;height:640px;padding:40px;box-sizing:border-box;opacity:0;">
      <div class="url">https://www.youtube.com/watch?v=…</div>
      <div class="frame"><div class="play" id="play"></div></div>
      <div class="cursor" id="cursor" style="left:520px;top:320px;"></div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const fmt = (s) => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(Math.floor(s % 60)).padStart(2, "0");
    tl.to("#s4cap", { opacity: 1, duration: 0.3 }, 0);
    tl.to("#s4video", { opacity: 1, duration: 0.3 }, 0);
    tl.to("#s4timer", { opacity: 1, duration: 0.3 }, 0.2);
    tl.to("#cursor", { opacity: 1, duration: 0.1 }, 2.9);
    tl.fromTo("#cursor", { x: 0, y: 0 }, { x: 260, y: 40, duration: 0.5, ease: "power1.inOut" }, 3.0);
    tl.to("#play", { scale: 0.85, duration: 0.1 }, 3.5);
    tl.to("#play", { opacity: 0, duration: 0.1 }, 3.6);
    tl.set("#s4btn", { textContent: "Pause" }, 4.52);
    const clk = { s: 1500 };
    tl.to(clk, { s: 1496, duration: 0.48, ease: "none", onUpdate: () => { document.getElementById("s4clock").textContent = fmt(clk.s); } }, 4.52);
    window.__timelines = window.__timelines || {};
    window.__timelines["s4"] = tl;
  </script>
</body>
</html>
