<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../assets/style.css" />
  <script src="../assets/gsap.min.js"></script>
</head>
<body>
  <div data-composition-id="s5" data-width="1920" data-height="1080" class="clip">
    <div class="cap" id="s5cap" style="top:150px;font-size:56px;">Every session, exported as CSV.</div>
    <div class="card" style="left:380px;top:280px;width:1160px;height:520px;padding:60px;box-sizing:border-box;">
      <div style="display:flex;gap:40px;">
        <div class="stat" id="st1"><div class="v">1h 15m</div><div class="l">Focus time</div></div>
        <div class="stat" id="st2"><div class="v">3</div><div class="l">Sessions</div></div>
      </div>
      <div class="export" id="exp">Export CSV</div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.to("#s5cap", { opacity: 1, duration: 0.3 }, 0);
    tl.to("#st1", { opacity: 1, duration: 0.3 }, 0.4);
    tl.to("#st2", { opacity: 1, duration: 0.3 }, 0.6);
    tl.to("#exp", { opacity: 1, duration: 0.3 }, 0.9);
    window.__timelines = window.__timelines || {};
    window.__timelines["s5"] = tl;
  </script>
</body>
</html>
